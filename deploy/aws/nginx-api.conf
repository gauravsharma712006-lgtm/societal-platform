# Replace <API_DOMAIN> and <FRONTEND_DOMAIN>. Enable after obtaining TLS.
# limit_req_zone and log_format belong to http {}, which includes Ubuntu sites.
limit_req_zone $binary_remote_addr zone=societal_auth:10m rate=5r/m;
log_format societal_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
map $http_origin $societal_cors_origin {
    default "";
    "https://<FRONTEND_DOMAIN>" $http_origin;
}

server {
    listen 80;
    server_name <API_DOMAIN>;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://<API_DOMAIN>$uri; }
}

server {
    listen 443 ssl;
    server_name <API_DOMAIN>;
    ssl_certificate /etc/letsencrypt/live/<API_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<API_DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 100k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    access_log /var/log/nginx/societal-access.log societal_safe;
    error_log /var/log/nginx/societal-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req_status 429;
    error_page 429 = @auth_limited;
    error_page 413 = @body_too_large;

    location @auth_limited {
        default_type application/json;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $societal_cors_origin always;
        add_header Vary "Origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"status":"error","message":"Too many authentication requests. Please try again later."}';
    }
    location @body_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $societal_cors_origin always;
        add_header Vary "Origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 413 '{"status":"error","message":"Request body is too large"}';
    }
    location ~ ^/api/auth/(login|register)/?$ {
        limit_req zone=societal_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite untrusted input: do not use $proxy_add_x_forwarded_for here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 20s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 20s;
    }
    location / { return 404; }
}
